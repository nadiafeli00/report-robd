<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data RO per Dealer (Prototype)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:#333;background:#f7f8fa}
.nav{background:#e86e0a;color:#fff;height:48px;display:flex;align-items:center;padding:0 16px;gap:14px}
.nav .brand{font-size:15px;flex:1}
.nav a{color:#fff;text-decoration:none;font-size:12px;margin-left:14px}
.proto{background:#fff8e1;border-bottom:1px solid #f0d58a;color:#8a6d00;text-align:center;padding:6px;font-size:11px}
.wrap{max-width:1000px;margin:24px auto;padding:0 12px}
.panel{background:#fff;border:1px solid #ddd}
.panel>.hd{padding:8px 10px;cursor:pointer;user-select:none}
.panel>.bd{padding:6px 10px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
label{display:block;margin:10px 0 6px}
input,select{width:100%;height:32px;border:1px solid #ddd;background:#fff;padding:0 8px;font-size:12px;border-radius:2px;color:#333}
.btn{border:0;border-radius:3px;padding:0 14px;height:30px;font-size:12px;font-weight:bold;cursor:pointer;color:#fff;display:inline-block;line-height:30px;text-decoration:none}
.b-or{background:#e86e0a}.b-bl{background:#2d91e0}.b-gr{background:#eee;color:#333;font-weight:normal}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.tools{display:flex;justify-content:flex-end;gap:5px;margin:10px 0}
.tw{overflow-x:auto;background:#fff}
table{border-collapse:collapse;width:100%;min-width:760px}
th{border:1px solid #ddd;padding:9px 8px;text-align:center;font-weight:normal;background:#fff;white-space:nowrap;font-size:11px}
td{border:1px solid #e5e5e5;padding:7px 8px;font-size:11px}
td.n{text-align:right}
tbody tr:nth-child(even){background:#fafafa}
.cs{height:26px;font-size:11px;min-width:70px}
.pg{padding:10px 2px;color:#666}
.hid{display:none}
</style>
</head>
<body>
<div class="nav"><span>&#9776;</span><span class="brand">Dealer Management System</span>
<a href="#">&#8962; Home</a><a href="#">Administrasi &#9662;</a><a href="#">Bahasa &#9662;</a><a href="#">Akun &#9662;</a></div>
<div class="proto">PROTOTYPE UI &mdash; seluruh isi tabel adalah data contoh, bukan data asli.</div>

<div class="wrap">
 <div class="panel">
  <div class="hd" onclick="document.getElementById('fb').classList.toggle('hid')">&#9662; Filter Data RO per Dealer</div>
  <div class="bd" id="fb">
   <div class="grid">
    <div><label>Bulan</label><select id="f_bl"></select></div>
    <div><label>Tahun</label><select id="f_th"></select></div>
   </div>
   <div class="row"><button class="btn b-gr" onclick="clr()">Clear</button><button class="btn b-or" onclick="apply()">FILTER</button></div>
  </div>
 </div>
 <div class="tools"><button class="btn b-bl" onclick="alert('Prototype: EXPORT belum aktif.')">EXPORT</button></div>
 <div class="tw"><table id="tb"></table></div>
 <div class="pg" id="info"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HEAD=['','Kode Dealer','Nama Dealer','SSU isi nama','Sama - CRM H1','Sama - CRM H2ds','Sama - CRM H2dl','Beda - CRM H1','Beda - CRM H2ds','Beda - CRM H2dl'];
/* DATA CONTOH */
const ROWS=[
['X0001','Dealer Contoh Satu',571,4,0,0,93,0,0],
['X0002','Dealer Contoh Dua',264,35,1,0,12,0,0],
['X0003','Dealer Contoh Tiga',258,62,0,0,7,2,0],
['X0004','Dealer Contoh Empat',225,0,0,0,0,0,0],
['X0005','Dealer Contoh Lima',81,43,0,2,5,0,1],
['X0006','Dealer Contoh Enam',117,1,0,0,20,0,0],
['X0007','Dealer Contoh Tujuh',100,0,0,0,3,1,0],
['X0008','Dealer Contoh Delapan',342,87,4,0,55,3,0]];
BULAN.forEach((b,i)=>{const o=document.createElement('option');o.value=i;o.textContent=b;$('f_bl').appendChild(o)});
['2025','2026','2027'].forEach(y=>{const o=document.createElement('option');o.textContent=y;$('f_th').appendChild(o)});
const now=new Date();
$('f_bl').value=now.getMonth();$('f_th').value=String(now.getFullYear());
const CF=[];
$('tb').innerHTML='<thead><tr>'+HEAD.map(x=>'<th>'+x+'</th>').join('')+'</tr><tr>'+HEAD.map((x,i)=>i?'<th style="padding:4px"><input class="cs" data-i="'+(i-1)+'" placeholder="Cari"></th>':'<th></th>').join('')+'</tr></thead><tbody id="tbb"></tbody>';
document.querySelectorAll('.cs').forEach(e=>e.addEventListener('input',()=>{CF[+e.dataset.i]=e.value.trim().toLowerCase();apply()}));
function clr(){CF.length=0;document.querySelectorAll('.cs').forEach(e=>e.value='');$('f_bl').value=now.getMonth();$('f_th').value=String(now.getFullYear());apply()}
function apply(){
  const r=ROWS.filter(x=>CF.every((f,i)=>!f||String(x[i]).toLowerCase().includes(f)));
  $('tbb').innerHTML=r.map(x=>'<tr><td style="text-align:center"><a class="btn b-bl" style="height:26px;line-height:26px;font-weight:normal" href="detail.html?kode='+x[0]+'&nama='+encodeURIComponent(x[1])+'">Detail</a></td><td>'+x[0]+'</td><td>'+x[1]+'</td>'+x.slice(2).map(v=>'<td class="n">'+v+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="10" style="text-align:center;color:#888">Tidak ada data</td></tr>';
  $('info').textContent='Menampilkan '+r.length+' dari '+ROWS.length+' dealer (contoh) — '+BULAN[+$('f_bl').value]+' '+$('f_th').value;
}
apply();
</script>
</body>
</html>
